<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover quality vehicles at AM MOTORS in Lebanon, owned by Ali Moussawi. Explore current cars, specifications, mileage, pricing, and direct contact details." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="AM MOTORS | Premium Cars in Lebanon" />
    <meta property="og:description" content="Find your next drive with AM MOTORS, owned by Ali Moussawi. Explore our latest quality vehicles in Lebanon." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ammotors-lb.web.app/" />
    <link rel="preload" as="image" href="/src/assets/gmc-hero-mobile.jpg" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet" />
    <style>
      #initial-loader {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        background: #080b0d;
        opacity: 1;
        transition: opacity 280ms ease, visibility 280ms ease;
      }

      #initial-loader.is-hidden {
        visibility: hidden;
        opacity: 0;
      }

      .initial-loader-content {
        display: flex;
        width: min(240px, 64vw);
        align-items: center;
        flex-direction: column;
        gap: 24px;
      }

      .initial-loader-logo {
        width: 210px;
        max-width: 100%;
        height: auto;
      }

      .initial-loader-track {
        width: 100%;
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
      }

      .initial-loader-bar {
        display: block;
        width: 0;
        height: 100%;
        background: #fff;
        animation: initial-loader-progress 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
        transition: width 220ms ease;
      }

      #initial-loader.is-complete .initial-loader-bar {
        width: 100%;
      }

      @keyframes initial-loader-progress {
        to { width: 88%; }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader,
        .initial-loader-bar {
          animation: none;
          transition: none;
        }

        .initial-loader-bar { width: 88%; }
      }
    </style>
    <title>AM MOTORS | Premium Cars in Lebanon</title>
  </head>
  <body>
    <div id="initial-loader" role="status" aria-label="Loading AM MOTORS">
      <div class="initial-loader-content">
        <img class="initial-loader-logo" src="/src/assets/am-motors-logo.png" alt="AM MOTORS" />
        <div class="initial-loader-track" aria-hidden="true">
          <span class="initial-loader-bar"></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

    <style>
      #initial-loader {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        background: #080b0d;
        opacity: 1;
        transition: opacity 280ms ease, visibility 280ms ease;
      }

      #initial-loader.is-hidden {
        visibility: hidden;
        opacity: 0;
      }

      .initial-loader-content {
        display: flex;
        width: min(240px, 64vw);
        align-items: center;
        flex-direction: column;
        gap: 24px;
      }

      .initial-loader-logo {
        width: 210px;
        max-width: 100%;
        height: auto;
      }

      .initial-loader-track {
        width: 100%;
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
      }

      .initial-loader-bar {
        display: block;
        width: 0;
        height: 100%;
        background: #fff;
        animation: initial-loader-progress 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
        transition: width 220ms ease;
      }

      #initial-loader.is-complete .initial-loader-bar {
        animation: none;
        width: 100%;
      }

      @keyframes initial-loader-progress {
        to { width: 88%; }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader,
        .initial-loader-bar {
          animation: none;
          transition: none;
        }

        .initial-loader-bar { width: 88%; }
      }
    </style>
    <title>AM MOTORS | Premium Cars in Lebanon</title>
  </head>
  <body>
    <div id="initial-loader" role="status" aria-label="Loading AM MOTORS">
      <div class="initial-loader-content">
        <img class="initial-loader-logo" src="/src/assets/am-motors-logo.png" alt="AM MOTORS" />
        <div class="initial-loader-track" aria-hidden="true">
          <span class="initial-loader-bar"></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

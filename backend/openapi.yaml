openapi: 3.1.0
info:
  title: AMMOTORS API
  version: 1.1.0
servers:
  - url: http://localhost:5000
paths:
  /api/health:
    get:
      summary: Process liveness
      responses:
        '200': { description: API process is running }
  /api/ready:
    get:
      summary: Dependency readiness
      responses:
        '200': { description: Dependencies are ready }
        '503': { description: A dependency is unavailable }
  /api/cars:
    get:
      summary: Legacy complete inventory array
      deprecated: false
      responses:
        '200':
          description: Backward-compatible inventory
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Car' } }
  /api/v1/cars:
    get:
      summary: Filtered cursor-paginated inventory
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [available, reserved, sold] } }
        - { name: make, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: minMileage, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxMileage, in: query, schema: { type: number, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, price-high, price-low, mileage-high, mileage-low, make], default: newest }
      responses:
        '200':
          description: Inventory page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
components:
  schemas:
    Car:
      type: object
      required: [id, make, model, year, price, mileage, engine, horsepower, transmission, drivetrain, fuel, exteriorColor, interiorColor, description, status, images]
      properties:
        id: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        price: { type: number }
        mileage: { type: number }
        engine: { type: string }
        horsepower: { type: number }
        transmission: { type: string }
        drivetrain: { type: string }
        fuel: { type: string }
        exteriorColor: { type: string }
        interiorColor: { type: string }
        description: { type: string }
        status: { type: string, enum: [available, reserved, sold] }
        images: { type: array, maxItems: 20, items: { type: string, format: uri } }
    CarPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Car' } }
        page:
          type: object
          required: [limit, hasMore, nextCursor]
          properties:
            limit: { type: integer }
            hasMore: { type: boolean }
            nextCursor: { type: [string, 'null'] }
  responses:
    ValidationError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties:
              message: { type: string }
              errors: { type: object }
